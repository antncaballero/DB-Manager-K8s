{{- $root := . }}
{{- range .Values.instances }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/managed-by: Helm
spec:
  serviceName: {{ .name }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
    spec:
      containers:
        - name: cassandra
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
          env:
            - name: CASSANDRA_CLUSTER_NAME
              value: {{ $root.Values.cluster.name | quote }}
            - name: CASSANDRA_AUTHENTICATOR
              value: PasswordAuthenticator
            - name: MAX_HEAP_SIZE
              value: {{ $root.Values.jvm.maxHeapSize | quote }}
            - name: HEAP_NEWSIZE
              value: {{ $root.Values.jvm.heapNewSize | quote }}
            - name: CASSANDRA_USER
              valueFrom:
                secretKeyRef:
                  name: shared-credentials
                  key: cassandra-username
            - name: CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-credentials
                  key: cassandra-password
          ports:
            - containerPort: 9042
          resources:
            requests:
              cpu: {{ $root.Values.resources.requests.cpu | quote }}
              memory: {{ $root.Values.resources.requests.memory | quote }}
            limits:
              memory: {{ $root.Values.resources.limits.memory | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/cassandra
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if $root.Values.storage.className }}
      storageClassName: {{ $root.Values.storage.className }}
      {{- end }}
      resources:
        requests:
          storage: {{ $root.Values.storage.size }}
{{- end }}
