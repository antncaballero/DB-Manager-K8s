apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ include "db-manager-app.namespace" . }}
  labels:
    {{- include "db-manager-app.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      app.kubernetes.io/part-of: {{ .Values.labels.appPartOf }}
  template:
    metadata:
      labels:
        {{- include "db-manager-app.commonLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ .Values.rbac.serviceAccountName }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          env:
            - name: DB_MANAGER_STORAGE_CLASS
              value: {{ .Values.backend.storageClassName | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.service.name }}
  namespace: {{ include "db-manager-app.namespace" . }}
  labels:
    {{- include "db-manager-app.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: {{ .Values.labels.appPartOf }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
