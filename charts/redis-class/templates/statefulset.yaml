{{- $root := . }}
{{- range .Values.instances }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/managed-by: Helm
spec:
  serviceName: {{ .name }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
    spec:
      containers:
        - name: redis
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-credentials-{{ $root.Release.Name }}
                  key: redis-password
          command:
            - /bin/sh
            - -c
          args:
            - redis-server --appendonly yes --save 60 1 --requirepass "$REDIS_PASSWORD" --dir /data
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: {{ $root.Values.resources.requests.cpu | quote }}
              memory: {{ $root.Values.resources.requests.memory | quote }}
            limits:
              memory: {{ $root.Values.resources.limits.memory | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if $root.Values.storage.className }}
      storageClassName: {{ $root.Values.storage.className }}
      {{- end }}
      resources:
        requests:
          storage: {{ $root.Values.storage.size }}
{{- end }}
