services:
  # ── Backend (API REST + herramientas K8s) ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tfg-backend
    ports:
      - "8000:8000"
    volumes:
      # Kubeconfig: apunta a EKS después de ejecutar setup-eks.sh
      - ~/.kube/config:/root/.kube/config:ro
      # Credenciales AWS: necesarias para que kubectl se autentique contra EKS
      - ~/.aws:/root/.aws:ro
      # Charts de Helm (misma ruta que espera k8s_manager.py)
      - ../charts:/charts:ro
    environment:
      - KUBECONFIG=/root/.kube/config
    restart: unless-stopped

  # ── Frontend (React + Vite → Nginx) ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tfg-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
