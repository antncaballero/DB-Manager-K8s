services:
  # ── Backend (API REST + herramientas K8s) ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tfg-backend
    ports:
      - "8000:8000"
    volumes:
      # Credenciales de Kubernetes
      - ~/.kube/config-backend:/root/.kube/config:ro
      # Charts de Helm
      - ../charts:/charts:ro
    environment:
      - KUBECONFIG=/root/.kube/config
    networks:
      - k3d-network
    restart: unless-stopped

  # ── Frontend (React + Vite → Nginx) ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tfg-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - k3d-network
    restart: unless-stopped

# ── Red de k3d ───────────────────────────────────────────────────────────────
networks:
  k3d-network:
    external: true
    # k3d crea la red siguiendo el patrón: k3d-<nombre-del-cluster>
    name: k3d-tfg-cluster